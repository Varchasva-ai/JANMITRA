<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <path id="topCurve" d="M 25,100 A 75,75 0 0,1 175,100" fill="none" />
    <path id="bottomCurve" d="M 26,145 A 80,80 0 0,0 174,145" fill="none" />
    <path id="bottomArcUnderline" d="M 32,184 Q 100,215 168,184" fill="none" stroke="#162556" stroke-width="4" stroke-linecap="round" />
  </defs>

  <!-- Background circle (transparent or soft white) -->
  <circle cx="100" cy="100" r="98" fill="#ffffff" />

  <!-- Arched Top Text: JANMITRA -->
  <text fill="#162556" font-size="25" font-family="'Inter', Arial, sans-serif" font-weight="900" letter-spacing="3.5">
    <textPath href="#topCurve" startOffset="50%" text-anchor="middle">JANMITRA</textPath>
  </text>

  <!-- Left Figure (Orange Citizen with Pants) -->
  <g id="figure-orange">
    <!-- Head -->
    <circle cx="76" cy="74" r="16.5" fill="#f97316" />
    <!-- Torso and Pants -->
    <path d="M 60,98 C 60,94 65,94 76,94 C 87,94 92,94 92,98 L 93,124 C 93,128 89,130 89,134 L 89,165 C 89,167 86,168 84,168 L 80,168 C 78,168 77,167 77,165 L 77,138 L 75,138 L 75,165 C 75,167 74,168 72,168 L 68,168 C 66,168 63,167 63,165 L 63,134 C 63,130 59,128 59,124 Z" fill="#f97316" />
  </g>

  <!-- Right Figure (Green Citizen with Dress) -->
  <g id="figure-green">
    <!-- Head -->
    <circle cx="126" cy="74" r="16.5" fill="#16a34a" />
    <!-- Dress / Skirt -->
    <path d="M 112,98 C 112,94 116,94 126,94 C 136,94 140,94 140,98 L 145,124 C 145,127 141,130 142,133 L 149,158 C 150,161 148,163 145,163 L 107,163 C 104,163 102,161 103,158 L 110,133 C 111,130 107,127 107,124 Z" fill="#16a34a" />
    <!-- Feet -->
    <rect x="116" y="163" width="7" height="8" rx="2" fill="#16a34a" />
    <rect x="129" y="163" width="7" height="8" rx="2" fill="#16a34a" />
  </g>

  <!-- Arched Bottom Ribbon & Hindi Text: जनमित्र -->
  <text fill="#162556" font-size="28" font-family="'Noto Sans Devanagari', 'Inter', Arial, sans-serif" font-weight="900" letter-spacing="1">
    <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">जनमित्र</textPath>
  </text>
</svg>
